name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs below are intended to be "required" status checks. Configure
# branch protection on `main` (Settings → Branches → Protect `main`) so that
# pushes/merges are blocked until they pass.
jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      VOICE_DATABASE_URL: postgresql+asyncpg://voice:voice@localhost:5432/voice
      VOICE_REDIS_URL: redis://localhost:6379/0
      VOICE_API_KEY_PEPPER: ci-pepper
      VOICE_WEBHOOK_HMAC_SECRET: ci-hmac

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-extras

      - name: Lint (ruff check)
        working-directory: apps/api
        run: uv run ruff check app tests

      - name: Format check (ruff format)
        working-directory: apps/api
        run: uv run ruff format --check app tests

      - name: Type check (mypy)
        working-directory: apps/api
        # Best-effort: failures here are non-blocking today (the codebase
        # isn't fully typed), but the gate is wired so individual files can
        # be tightened over time. Flip `continue-on-error` to false once
        # mypy is green across the board.
        continue-on-error: true
        run: uv run mypy app

      - name: Migrations apply cleanly
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Migrations match models (alembic check)
        working-directory: apps/api
        run: uv run alembic check

      - name: Tests + coverage gate
        working-directory: apps/api
        # `--cov-fail-under` enforces a baseline. Bump this number as
        # coverage rises; never lower it.
        run: |
          uv run pytest -q -n auto \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 7

      - name: Dependency audit (pip-audit)
        working-directory: apps/api
        # Non-blocking until we triage existing advisories. Surfaces high-
        # severity CVEs in the job summary.
        continue-on-error: true
        run: uvx pip-audit --strict --skip-editable

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store dir
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        working-directory: apps/web
        run: pnpm lint

      - name: Type check
        working-directory: apps/web
        # `tsc -b --pretty false` keeps logs grepable in CI.
        run: pnpm exec tsc -b --pretty false

      - name: Unit tests (vitest)
        working-directory: apps/web
        run: pnpm test

      - name: Build
        working-directory: apps/web
        run: pnpm build

      - name: Bundle size guard
        working-directory: apps/web
        # Hard ceiling on the gzipped charts vendor — the biggest chunk by
        # far. Stops Recharts/D3 imports from creeping in unnoticed.
        run: |
          size=$(stat -c%s dist/assets/charts-*.js)
          echo "charts chunk size: $size bytes"
          if [ "$size" -gt 600000 ]; then
            echo "::error::charts chunk exceeded 600KB budget ($size)"
            exit 1
          fi

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Upload playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

      - name: Dependency audit (pnpm audit)
        working-directory: apps/web
        # Non-blocking — pnpm audit is famously noisy on transitive deps.
        # Triage high+ findings, then turn this into a hard gate.
        continue-on-error: true
        run: pnpm audit --audit-level=high

  required:
    # Single aggregate check teams can pin in Branch Protection.
    name: Required checks
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
            echo "::error::A required job failed (api=${{ needs.api.result }}, web=${{ needs.web.result }})"
            exit 1
          fi
