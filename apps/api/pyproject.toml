[project]
name = "voice-api"
version = "0.1.0"
description = "Voice 2.0 backend API"
authors = [{ name = "rachit", email = "pathakrachit4@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4",
    "orjson>=3.10",
    "tenacity>=9.0",
    "boto3>=1.35",
    "litellm>=1.83.14",
    "websockets>=16.0",
    "pynacl>=1.6.2",
    "numpy>=2.4.4",
    "pypdf>=5.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "arq>=0.26",
    "audioop-lts>=0.2.2; python_version>='3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = [
    "S101",   # assert (used in tests + dev guards)
    "B008",   # FastAPI Depends() in defaults is the standard idiom
    "E501",   # line too long — handled by readability, not enforced
    "S110",   # try/except/pass — common around best-effort cleanup
    "N806",   # variable in function should be lowercase — SessionLocal, BaseTitle, etc.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "N802"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# AsyncClient + ASGITransport run route handlers via anyio task groups,
# which use threads under the hood — without `concurrency = ["thread"]`
# coverage misses lines executed inside FastAPI route bodies and the
# numbers underreport by ~20 points.
concurrency = ["thread", "greenlet"]
source = ["app"]
